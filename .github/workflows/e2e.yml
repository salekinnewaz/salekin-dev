name: E2E

# Runs the Playwright suite on every push to main and on every
# pull request targeting main. Mobile project is skipped to save
# runner time; opt in with --project=mobile if needed.
#
# Outputs:
#   - playwright-report (artifact, always)
#   - test-results (artifact, on failure)
#   - allure-results (artifact, always)
#   - allure-report HTML hosted on GitHub Pages (on push to main)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Allow the pages job to run even when the e2e job is skipped (e.g.
# when restricted branch). Also cancel any in-flight run for the
# same ref so concurrent pushes don't pile up pages deploys.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# Default permissions are restrictive (read-only) at the workflow
# level. Each job can widen them as needed. The `pages` job
# specifically needs `contents: write` to push the gh-pages branch
# via the JamesIves action.
permissions:
  contents: read

jobs:
  e2e:
    name: Playwright (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        # --with-deps installs the system libs Chromium needs on
        # Linux runners (libnss, libatk, etc).
        run: pnpm exec playwright install --with-deps chromium

      - name: Prepare test DB
        # The test SQLite is created and seeded BEFORE build, not
        # inside Playwright's globalSetup. `next build` renders
        # pages at build time and queries the DB (Education,
        # Setting, etc.) — so the schema + seed data must exist
        # first or the build fails with "table does not exist".
        run: pnpm db:push && pnpm db:seed
        env:
          DATABASE_URL: file:./test.db
          NODE_ENV: test

      - name: Build
        # Build the production bundle so webServer can `next start`.
        # The DB is already pushed + seeded by the previous step;
        # globalSetup re-seeds before the browser launches.
        run: pnpm build
        env:
          DATABASE_URL: file:./test.db
          NODE_ENV: test
          ADMIN_PASSWORD: test-admin-pass-1234
          ADMIN_SESSION_SECRET: playwright-e2e-session-secret-32+chars

      - name: Run Playwright
        # --project=chromium skips the mobile project.
        # --reporter=line keeps the log scannable in CI output.
        run: pnpm test:e2e --project=chromium --reporter=line
        env:
          CI: true

      - name: Deploy to Vercel (production)
        # Auto-deploy on push to main. We invoke the Vercel CLI
        # instead of installing the GitHub App because the Vercel
        # project was created via CLI (not via the "Import" UI),
        # so the GitHub integration isn't installed. The CLI
        # approach: `vercel deploy --prod --yes --token $TOKEN`
        # reads the linked `salekin-dev` project, builds with
        # the existing env vars (TURSO_*, DATABASE_URL, etc.),
        # and promotes the result to the production alias
        # (salekin-dev.vercel.app). Skipped on PRs — only push
        # to main should land in production. `--project` is
        # passed explicitly because the `.vercel/project.json`
        # link file is gitignored and absent on CI.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm exec vercel deploy --prod --yes --token "$VERCEL_TOKEN" --project prj_UejPnEPmnIel6eXz3HKsl6imzspm
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Generate Allure report
        # `allure-playwright` already wrote JSON results to
        # ./allure-results during the test run; this step turns
        # those into a static HTML report under ./allure-report.
        if: always()
        run: pnpm exec allure generate ./allure-results -o ./allure-report --clean

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

      - name: Upload Allure JSON results
        # Raw JSON is small and useful for re-running the report
        # generator locally without re-running the tests.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 14

      - name: Upload Allure HTML report
        # The generated static report. Published to GitHub Pages
        # by the `pages` job below on push-to-main.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

  # Deploy the freshly-built Allure report to GitHub Pages by
  # pushing ./allure-report/ to the `gh-pages` branch. We use
  # JamesIves' action (not the official actions/deploy-pages)
  # because the latter requires a workflow-source Pages site
  # with no branch source — the API doesn't reliably clear the
  # branch source, so the Jekyll README kept being served from
  # the branch instead of our Allure artifact. The branch model
  # is simpler and well-tested.
  pages:
    name: Publish Allure report
    needs: e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The JamesIves deploy action pushes to the gh-pages branch,
    # which requires `contents: write`. We also need `pages: write`
    # so the deployment can update the live site.
    permissions:
      contents: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Allure HTML report
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: Deploy to GitHub Pages
        id: deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: allure-report
          branch: gh-pages
          single-commit: true
          clean: true
          git-config-name: github-actions[bot]
          git-config-email: github-actions[bot]@users.noreply.github.com
