<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Rideshare app preview placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#1a1140"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161a2e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0d1020" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="mapGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#a78bfa" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#grid)"/>

  <!-- Map area with route -->
  <g transform="translate(40,40)">
    <rect width="720" height="380" rx="16" fill="#0d1020" stroke="#a78bfa" stroke-opacity="0.15"/>
    <!-- Map roads -->
    <path d="M 80 60 Q 200 100 280 180 T 480 320 L 640 340" fill="none" stroke="#a78bfa" stroke-opacity="0.4" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 8"/>
    <path d="M 60 200 Q 200 220 340 240 T 600 280" fill="none" stroke="#22d3ee" stroke-opacity="0.3" stroke-width="2"/>
    <path d="M 100 320 L 200 280 L 300 340 L 420 300" fill="none" stroke="#a78bfa" stroke-opacity="0.25" stroke-width="2"/>

    <!-- Map glow zones -->
    <ellipse cx="200" cy="160" rx="120" ry="80" fill="url(#mapGlow)"/>
    <ellipse cx="500" cy="280" rx="140" ry="100" fill="url(#mapGlow)"/>

    <!-- Origin marker -->
    <circle cx="100" cy="80" r="10" fill="#a78bfa"/>
    <circle cx="100" cy="80" r="20" fill="none" stroke="#a78bfa" stroke-opacity="0.4" stroke-width="2"/>

    <!-- Destination marker -->
    <circle cx="600" cy="320" r="10" fill="#22d3ee"/>
    <circle cx="600" cy="320" r="20" fill="none" stroke="#22d3ee" stroke-opacity="0.4" stroke-width="2"/>

    <!-- Car icon mid-route -->
    <g transform="translate(310,180)">
      <circle r="14" fill="#0b1020" stroke="url(#accent)" stroke-width="2"/>
      <path d="M -6 -2 L -4 -5 L 4 -5 L 6 -2 L 6 3 L 4 5 L -4 5 L -6 3 Z" fill="#a78bfa"/>
    </g>

    <!-- Map UI labels -->
    <text x="100" y="55" font-family="ui-monospace,monospace" font-size="11" fill="#a78bfa" fill-opacity="0.8">PICKUP</text>
    <text x="555" y="305" font-family="ui-monospace,monospace" font-size="11" fill="#22d3ee" fill-opacity="0.8">DROP-OFF</text>
  </g>

  <!-- Bottom info card -->
  <g transform="translate(40,440)">
    <rect width="720" height="120" rx="14" fill="url(#cardGrad)" stroke="#a78bfa" stroke-opacity="0.2"/>
    <text x="24" y="42" font-family="Inter,sans-serif" font-weight="600" font-size="20" fill="#e5e7eb">RS Sjoliv</text>
    <text x="24" y="66" font-family="Inter,sans-serif" font-size="13" fill="#9ca3af">Rideshare Platform · Web + Mobile</text>

    <!-- Mini stats -->
    <g transform="translate(420,30)">
      <rect width="80" height="60" rx="8" fill="#a78bfa" fill-opacity="0.08"/>
      <text x="40" y="28" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="18" font-weight="600" fill="#a78bfa">12</text>
      <text x="40" y="48" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#9ca3af" letter-spacing="1">RELEASES</text>
    </g>
    <g transform="translate(520,30)">
      <rect width="80" height="60" rx="8" fill="#22d3ee" fill-opacity="0.08"/>
      <text x="40" y="28" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="18" font-weight="600" fill="#22d3ee">340+</text>
      <text x="40" y="48" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#9ca3af" letter-spacing="1">TEST CASES</text>
    </g>
    <g transform="translate(620,30)">
      <rect width="80" height="60" rx="8" fill="#a78bfa" fill-opacity="0.08"/>
      <text x="40" y="28" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="18" font-weight="600" fill="#a78bfa">98%</text>
      <text x="40" y="48" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#9ca3af" letter-spacing="1">COVERAGE</text>
    </g>
  </g>
</svg>
