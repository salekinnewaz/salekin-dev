<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Norway release programme preview placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0e2440"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1d35" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0a1428" stop-opacity="0.95"/>
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#22d3ee" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#grid)"/>

  <!-- Top header bar -->
  <g transform="translate(40,40)">
    <rect width="720" height="48" rx="10" fill="url(#cardGrad)" stroke="#22d3ee" stroke-opacity="0.2"/>
    <circle cx="24" cy="24" r="6" fill="#22d3ee"/>
    <text x="44" y="29" font-family="Inter,sans-serif" font-weight="600" font-size="14" fill="#e5e7eb">Release Pipeline · Norway</text>
    <text x="660" y="29" font-family="JetBrains Mono,monospace" font-size="12" fill="#22d3ee">v3.2.1</text>
  </g>

  <!-- Timeline / pipeline rows -->
  <g transform="translate(40,108)">
    <rect width="720" height="280" rx="14" fill="url(#cardGrad)" stroke="#22d3ee" stroke-opacity="0.15"/>

    <!-- Pipeline column labels -->
    <text x="40" y="32" font-family="ui-monospace,monospace" font-size="10" fill="#9ca3af" letter-spacing="1.5">UAT</text>
    <text x="200" y="32" font-family="ui-monospace,monospace" font-size="10" fill="#9ca3af" letter-spacing="1.5">SIGN-OFF</text>
    <text x="360" y="32" font-family="ui-monospace,monospace" font-size="10" fill="#9ca3af" letter-spacing="1.5">STAGING</text>
    <text x="520" y="32" font-family="ui-monospace,monospace" font-size="10" fill="#9ca3af" letter-spacing="1.5">PROD</text>

    <!-- Vertical separators -->
    <line x1="160" y1="20" x2="160" y2="260" stroke="#22d3ee" stroke-opacity="0.1"/>
    <line x1="320" y1="20" x2="320" y2="260" stroke="#22d3ee" stroke-opacity="0.1"/>
    <line x1="480" y1="20" x2="480" y2="260" stroke="#22d3ee" stroke-opacity="0.1"/>
    <line x1="640" y1="20" x2="640" y2="260" stroke="#22d3ee" stroke-opacity="0.1"/>

    <!-- Pipeline rows: 3 releases -->
    <!-- Release 1 -->
    <g transform="translate(20,60)">
      <rect width="120" height="40" rx="6" fill="#22d3ee" fill-opacity="0.15" stroke="#22d3ee" stroke-opacity="0.4"/>
      <circle cx="16" cy="20" r="5" fill="#22d3ee"/>
      <text x="32" y="24" font-family="Inter,sans-serif" font-size="12" fill="#e5e7eb">R1 · Aug</text>

      <rect x="140" width="120" height="40" rx="6" fill="#22d3ee" fill-opacity="0.15" stroke="#22d3ee" stroke-opacity="0.4"/>
      <path d="M 156 20 L 162 14 L 162 26 Z" fill="#22d3ee"/>
      <text x="172" y="24" font-family="Inter,sans-serif" font-size="12" fill="#e5e7eb">Signed</text>

      <rect x="280" width="120" height="40" rx="6" fill="#22d3ee" fill-opacity="0.15" stroke="#22d3ee" stroke-opacity="0.4"/>
      <text x="296" y="24" font-family="Inter,sans-serif" font-size="12" fill="#e5e7eb">✓ Deployed</text>

      <rect x="420" width="120" height="40" rx="6" fill="#34d399" fill-opacity="0.2" stroke="#34d399" stroke-opacity="0.5"/>
      <text x="436" y="24" font-family="Inter,sans-serif" font-size="12" fill="#34d399">Live ✓</text>
    </g>

    <!-- Release 2 -->
    <g transform="translate(20,120)">
      <rect width="120" height="40" rx="6" fill="#22d3ee" fill-opacity="0.15" stroke="#22d3ee" stroke-opacity="0.4"/>
      <circle cx="16" cy="20" r="5" fill="#22d3ee"/>
      <text x="32" y="24" font-family="Inter,sans-serif" font-size="12" fill="#e5e7eb">R2 · Oct</text>

      <rect x="140" width="120" height="40" rx="6" fill="#22d3ee" fill-opacity="0.15" stroke="#22d3ee" stroke-opacity="0.4"/>
      <text x="156" y="24" font-family="Inter,sans-serif" font-size="12" fill="#e5e7eb">Signed</text>

      <rect x="280" width="120" height="40" rx="6" fill="#22d3ee" fill-opacity="0.15" stroke="#22d3ee" stroke-opacity="0.4"/>
      <text x="296" y="24" font-family="Inter,sans-serif" font-size="12" fill="#e5e7eb">In QA</text>

      <rect x="420" width="120" height="40" rx="6" fill="#6b7280" fill-opacity="0.1" stroke="#6b7280" stroke-opacity="0.3" stroke-dasharray="3 3"/>
      <text x="436" y="24" font-family="Inter,sans-serif" font-size="12" fill="#9ca3af">Pending</text>
    </g>

    <!-- Release 3 -->
    <g transform="translate(20,180)">
      <rect width="120" height="40" rx="6" fill="#22d3ee" fill-opacity="0.15" stroke="#22d3ee" stroke-opacity="0.4"/>
      <circle cx="16" cy="20" r="5" fill="#fbbf24"/>
      <text x="32" y="24" font-family="Inter,sans-serif" font-size="12" fill="#e5e7eb">R3 · Dec</text>

      <rect x="140" width="120" height="40" rx="6" fill="#6b7280" fill-opacity="0.1" stroke="#6b7280" stroke-opacity="0.3" stroke-dasharray="3 3"/>
      <text x="156" y="24" font-family="Inter,sans-serif" font-size="12" fill="#9ca3af">In review</text>

      <rect x="280" width="120" height="40" rx="6" fill="#6b7280" fill-opacity="0.1" stroke="#6b7280" stroke-opacity="0.3" stroke-dasharray="3 3"/>
      <text x="296" y="24" font-family="Inter,sans-serif" font-size="12" fill="#9ca3af">—</text>

      <rect x="420" width="120" height="40" rx="6" fill="#6b7280" fill-opacity="0.1" stroke="#6b7280" stroke-opacity="0.3" stroke-dasharray="3 3"/>
      <text x="436" y="24" font-family="Inter,sans-serif" font-size="12" fill="#9ca3af">—</text>
    </g>
  </g>

  <!-- Bottom stat strip -->
  <g transform="translate(40,408)">
    <rect width="720" height="152" rx="14" fill="url(#cardGrad)" stroke="#22d3ee" stroke-opacity="0.15"/>
    <text x="24" y="36" font-family="Inter,sans-serif" font-weight="600" font-size="16" fill="#e5e7eb">Norway release programme</text>
    <text x="24" y="58" font-family="Inter,sans-serif" font-size="12" fill="#9ca3af">3 production releases · UAT → sign-off → staging → prod</text>

    <g transform="translate(24,80)">
      <text font-family="JetBrains Mono,monospace" font-size="28" font-weight="600" fill="#22d3ee">3</text>
      <text y="22" font-family="ui-monospace,monospace" font-size="10" fill="#9ca3af" letter-spacing="1.5">RELEASES</text>
    </g>
    <g transform="translate(184,80)">
      <text font-family="JetBrains Mono,monospace" font-size="28" font-weight="600" fill="#34d399">0</text>
      <text y="22" font-family="ui-monospace,monospace" font-size="10" fill="#9ca3af" letter-spacing="1.5">SEV-1 BUGS</text>
    </g>
    <g transform="translate(344,80)">
      <text font-family="JetBrains Mono,monospace" font-size="28" font-weight="600" fill="#22d3ee">100%</text>
      <text y="22" font-family="ui-monospace,monospace" font-size="10" fill="#9ca3af" letter-spacing="1.5">UAT COVERAGE</text>
    </g>
    <g transform="translate(504,80)">
      <text font-family="JetBrains Mono,monospace" font-size="28" font-weight="600" fill="#a78bfa">2d</text>
      <text y="22" font-family="ui-monospace,monospace" font-size="10" fill="#9ca3af" letter-spacing="1.5">AVG SIGN-OFF</text>
    </g>
  </g>
</svg>
