<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Multi-industry QA preview placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e2e"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0f30" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0a0818" stop-opacity="0.95"/>
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f472b6" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#grid)"/>

  <!-- Header strip -->
  <g transform="translate(40,40)">
    <rect width="720" height="48" rx="10" fill="url(#cardGrad)" stroke="#f472b6" stroke-opacity="0.2"/>
    <circle cx="24" cy="24" r="6" fill="#f472b6"/>
    <text x="44" y="29" font-family="Inter,sans-serif" font-weight="600" font-size="14" fill="#e5e7eb">Multi-Industry QA · Test Suite</text>
    <g transform="translate(580,16)">
      <rect width="120" height="20" rx="10" fill="#f472b6" fill-opacity="0.15"/>
      <text x="60" y="14" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="10" fill="#f472b6">5 ENVIRONMENTS</text>
    </g>
  </g>

  <!-- Bar chart / coverage -->
  <g transform="translate(40,108)">
    <rect width="450" height="280" rx="14" fill="url(#cardGrad)" stroke="#f472b6" stroke-opacity="0.15"/>
    <text x="24" y="34" font-family="Inter,sans-serif" font-weight="600" font-size="14" fill="#e5e7eb">Test coverage by suite</text>

    <!-- Y axis line -->
    <line x1="60" y1="60" x2="60" y2="240" stroke="#f472b6" stroke-opacity="0.2"/>
    <line x1="60" y1="240" x2="420" y2="240" stroke="#f472b6" stroke-opacity="0.2"/>

    <!-- Bars (4 suites) -->
    <g>
      <!-- Suite 1 -->
      <rect x="90" y="80" width="50" height="160" rx="4" fill="url(#accent)"/>
      <text x="115" y="258" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#9ca3af">API</text>
      <text x="115" y="74" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="11" font-weight="600" fill="#f472b6">94%</text>

      <!-- Suite 2 -->
      <rect x="170" y="60" width="50" height="180" rx="4" fill="url(#accent)"/>
      <text x="195" y="258" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#9ca3af">E2E</text>
      <text x="195" y="54" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="11" font-weight="600" fill="#f472b6">99%</text>

      <!-- Suite 3 -->
      <rect x="250" y="100" width="50" height="140" rx="4" fill="url(#accent)"/>
      <text x="275" y="258" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#9ca3af">PERF</text>
      <text x="275" y="94" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="11" font-weight="600" fill="#f472b6">87%</text>

      <!-- Suite 4 -->
      <rect x="330" y="120" width="50" height="120" rx="4" fill="url(#accent)"/>
      <text x="355" y="258" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#9ca3af">SEC</text>
      <text x="355" y="114" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="11" font-weight="600" fill="#f472b6">78%</text>
    </g>
  </g>

  <!-- Right column: industry list -->
  <g transform="translate(510,108)">
    <rect width="250" height="280" rx="14" fill="url(#cardGrad)" stroke="#f472b6" stroke-opacity="0.15"/>
    <text x="20" y="34" font-family="Inter,sans-serif" font-weight="600" font-size="13" fill="#e5e7eb">Industries</text>

    <g transform="translate(20,52)">
      <rect width="210" height="32" rx="6" fill="#f472b6" fill-opacity="0.08"/>
      <circle cx="14" cy="16" r="4" fill="#f472b6"/>
      <text x="28" y="20" font-family="Inter,sans-serif" font-size="12" fill="#e5e7eb">FinTech · 412 cases</text>
    </g>
    <g transform="translate(20,92)">
      <rect width="210" height="32" rx="6" fill="#a78bfa" fill-opacity="0.08"/>
      <circle cx="14" cy="16" r="4" fill="#a78bfa"/>
      <text x="28" y="20" font-family="Inter,sans-serif" font-size="12" fill="#e5e7eb">Healthcare · 287</text>
    </g>
    <g transform="translate(20,132)">
      <rect width="210" height="32" rx="6" fill="#f472b6" fill-opacity="0.08"/>
      <circle cx="14" cy="16" r="4" fill="#f472b6"/>
      <text x="28" y="20" font-family="Inter,sans-serif" font-size="12" fill="#e5e7eb">eCommerce · 1.2k</text>
    </g>
    <g transform="translate(20,172)">
      <rect width="210" height="32" rx="6" fill="#a78bfa" fill-opacity="0.08"/>
      <circle cx="14" cy="16" r="4" fill="#a78bfa"/>
      <text x="28" y="20" font-family="Inter,sans-serif" font-size="12" fill="#e5e7eb">Logistics · 198</text>
    </g>
    <g transform="translate(20,212)">
      <rect width="210" height="32" rx="6" fill="#f472b6" fill-opacity="0.08"/>
      <circle cx="14" cy="16" r="4" fill="#f472b6"/>
      <text x="28" y="20" font-family="Inter,sans-serif" font-size="12" fill="#e5e7eb">SaaS · 856</text>
    </g>
  </g>

  <!-- Bottom strip -->
  <g transform="translate(40,408)">
    <rect width="720" height="152" rx="14" fill="url(#cardGrad)" stroke="#f472b6" stroke-opacity="0.15"/>
    <text x="24" y="36" font-family="Inter,sans-serif" font-weight="600" font-size="16" fill="#e5e7eb">[INTERNATIONAL CLIENT] — Multi-industry QA</text>
    <text x="24" y="58" font-family="Inter,sans-serif" font-size="12" fill="#9ca3af">Cross-vertical test automation across 5 product lines</text>

    <g transform="translate(24,80)">
      <text font-family="JetBrains Mono,monospace" font-size="28" font-weight="600" fill="#f472b6">5</text>
      <text y="22" font-family="ui-monospace,monospace" font-size="10" fill="#9ca3af" letter-spacing="1.5">INDUSTRIES</text>
    </g>
    <g transform="translate(184,80)">
      <text font-family="JetBrains Mono,monospace" font-size="28" font-weight="600" fill="#a78bfa">2.9k</text>
      <text y="22" font-family="ui-monospace,monospace" font-size="10" fill="#9ca3af" letter-spacing="1.5">TEST CASES</text>
    </g>
    <g transform="translate(344,80)">
      <text font-family="JetBrains Mono,monospace" font-size="28" font-weight="600" fill="#f472b6">14</text>
      <text y="22" font-family="ui-monospace,monospace" font-size="10" fill="#9ca3af" letter-spacing="1.5">PIPELINES</text>
    </g>
    <g transform="translate(504,80)">
      <text font-family="JetBrains Mono,monospace" font-size="28" font-weight="600" fill="#a78bfa">40%</text>
      <text y="22" font-family="ui-monospace,monospace" font-size="10" fill="#9ca3af" letter-spacing="1.5">CYCLE TIME ↓</text>
    </g>
  </g>
</svg>
